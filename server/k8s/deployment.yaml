apiVersion: apps/v1
kind: Deployment
metadata:
  name: express-app
spec:
  replicas: 3
  selector:
    matchLabels:
      app: express-app
  template:
    metadata:
      labels:
        app: express-app
    spec:
      containers:
        - name: express
          image: registry/express-app:latest
          ports:
            - containerPort: 3000
            - containerPort: 9100
          env:
            - name: MONGODB_URI
              valueFrom:
                secretKeyRef:
                  name: express-secrets
                  key: mongodb_uri
            - name: DB_NAME
              value: "express_app"
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: express-app
spec:
  selector:
    app: express-app
  ports:
    - name: http
      port: 3000
      targetPort: 3000
    - name: metrics
      port: 9100
      targetPort: 9100
  type: LoadBalancer