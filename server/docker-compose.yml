version: '3.8'
services:
  express-app:
    build: .
    ports:
      - "3000:3000"
      - "9100:9100"
    environment:
      - MONGODB_URI=mongodb://mongo:27017
      - DB_NAME=express_app
    depends_on:
      - mongo
    
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data: